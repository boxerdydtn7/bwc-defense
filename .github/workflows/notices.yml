name: Refresh notices & deploy

# 매일 새벽 6시(KST)에 공고 수집 → 커밋 → 빌드 → 배포.
# 손으로 즉시 돌리고 싶으면 GitHub > Actions > 이 워크플로우 > "Run workflow".
on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 06:00 KST (매일)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci

      - name: Fetch 나라장터 notices
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/fetch-notices.mjs

      - name: Commit notices.json (변경 있을 때만)
        run: |
          git config user.name "bwc-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/notices.json
          git commit -m "chore: refresh notices [skip ci]" || echo "변경 없음"
          git push || echo "푸시할 것 없음"

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh-and-build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
